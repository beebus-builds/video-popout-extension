<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <button id="popout" class="primary">Pop out video</button>
  <div id="status" class="status">Looking for videos…</div>
  <div id="list" class="list"></div>
  <div id="controls" class="controls" hidden>
    <button id="ctl-play" class="chip" title="Play / pause">Play/Pause</button>
    <button id="ctl-mute" class="chip" title="Mute / unmute">Mute</button>
    <button id="ctl-back" class="chip" title="Back 10 seconds">-10s</button>
    <button id="ctl-fwd" class="chip" title="Forward 10 seconds">+10s</button>
    <button id="ctl-speed" class="chip" title="Cycle playback speed">1x</button>
  </div>
  <div id="audio" class="controls" hidden>
    <label class="vol-row" title="Volume">
      Volume
      <input id="volume" type="range" min="0" max="100" value="100" />
      <span id="volume-val">100%</span>
    </label>
    <select id="boost" title="Volume boost past 100% — with limiter, no harsh clipping">
      <option value="100">100% vol</option>
      <option value="150">150% boost</option>
      <option value="200">200% boost</option>
      <option value="300">300% max</option>
      <option value="400">400% extreme</option>
    </select>
    <select id="eq" title="EQ preset">
      <option value="flat">Flat EQ</option>
      <option value="bass">Bass punch</option>
      <option value="vocal">Vocal clear</option>
      <option value="treble">Treble bright</option>
      <option value="loud">Loud power</option>
      <option value="night">Night dialogue</option>
    </select>
    <button id="noise" class="chip" title="Toggle noise gate / voice isolation">Noise Gate</button>
    <button id="transcript" class="chip" title="Start live transcript">Transcript</button>
    <button id="transcript-export" class="chip" title="Download transcript">Export TXT</button>
    <div id="transcript-status" class="sub" style="font-size:10px;color:#9ca3af;margin-top:4px;"></div>
  </div>
  <div class="footer">
    <div class="hints">
      <div><kbd>Alt</kbd>+<kbd>P</kbd> pops the video · hover the video for on-page Pop</div>
    </div>
    <button id="options" class="link">Options</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
