<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Video Popout Options</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main>
    <h1>Video Popout</h1>
    <p class="lede">Pop video + volume essentials — no tracking, everything stays in your browser.</p>

    <label class="row">
      <span>
        <strong>Search embedded players</strong>
        <small>Look inside iframes (YouTube embeds, news sites). Uses the active tab only.</small>
      </span>
      <input type="checkbox" id="searchIframes" />
    </label>

    <label class="row">
      <span>
        <strong>Show video picker with thumbnails</strong>
        <small>List every video in the popup with live previews.</small>
      </span>
      <input type="checkbox" id="showPicker" />
    </label>

    <label class="row">
      <span>
        <strong>Hover Pop button</strong>
        <small>Show a small “Pop out” button over each video on the page.</small>
      </span>
      <input type="checkbox" id="hoverButtons" />
    </label>

    <label class="row">
      <span>
        <strong>Show right-click menu</strong>
        <small>“Pop out video” on videos.</small>
      </span>
      <input type="checkbox" id="showContextMenu" />
    </label>

    <p style="margin-top:16px"><a href="welcome.html">Welcome</a> · <a href="privacy.html">Privacy</a></p>
    <div id="status" class="status"></div>
  </main>
  <script src="options.js"></script>
</body>
</html>
