<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Video Wall</title>
  <link rel="stylesheet" href="wall.css" />
</head>
<body>
  <header>
    <span id="count">Video Wall</span>
    <span class="spacer"></span>
    <button id="pip-wall" class="ghost">Pop this wall always on top</button>
    <button id="close" class="ghost">Close</button>
  </header>
  <div id="grid" class="grid"></div>
  <p class="hint">Tip: YouTube embeds play muted until you click. Add more YouTube tabs and reopen the wall.</p>
  <script src="wall.js"></script>
</body>
</html>
